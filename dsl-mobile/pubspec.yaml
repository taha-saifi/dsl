name: dsl
description: "DSL student app: professional vocabulary in a foreign language."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.0.0
  go_router: ^17.5.0
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  just_audio: ^0.10.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  freezed: ^3.2.5
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    - assets/branding/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/inter/Inter-ExtraBold.ttf
          weight: 800

# Launcher icon and splash come from the Figma logo (node 91:14 in 122:335),
# placed on Midnight Ink like the Splash screen. Regenerate with:
#   dart run flutter_launcher_icons && dart run flutter_native_splash:create
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/icon_legacy.png
  adaptive_icon_background: "#1E1B4B"
  adaptive_icon_foreground: assets/branding/logo.png
  adaptive_icon_foreground_inset: 22
  min_sdk_android: 24

flutter_native_splash:
  android: true
  ios: false
  web: false
  color: "#1E1B4B"
  image: assets/branding/logo.png
  # Android 12+ masks the splash icon to a circle (2/3 of the canvas), so it
  # uses a padded copy that keeps the whole logo inside it.
  android_12:
    color: "#1E1B4B"
    image: assets/branding/splash_android12.png
