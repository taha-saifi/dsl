server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # Vite puts a content hash in every file name under /assets, so a changed
    # file always gets a new URL and these can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html points at the current hashed assets: always revalidate it.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        # React Router handles client-side routes like /units/abc123 —
        # nginx has no file at that path, so fall back to index.html and
        # let the app's router take over instead of 404ing.
        try_files $uri /index.html;
    }
}
