services:
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio:
    image: quay.io/minio/minio
    command: server /data --console-address ":9001"
    environment:
      # Local-dev credentials only — never reuse these for a real deployment.
      MINIO_ROOT_USER: dsl-minio-admin
      MINIO_ROOT_PASSWORD: dsl-minio-secret-key
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./dsl-backend
      dockerfile: Dockerfile
    depends_on:
      mongo:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://mongo:27017/dsl
      MINIO_INTERNAL_ENDPOINT: http://minio:9000
      # Override with your LAN IP so a phone can load media, e.g.
      # MINIO_PUBLIC_ENDPOINT=http://192.168.1.50:9000 docker compose up
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      MINIO_ACCESS_KEY: dsl-minio-admin
      MINIO_SECRET_KEY: dsl-minio-secret-key
      MINIO_BUCKET: dsl-media
      MINIO_REGION: us-east-1
      JWT_SECRET: dsl-local-dev-jwt-secret-change-me
      FRONTEND_URL: http://localhost:5173
      PORT: 5000
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./dsl-teacher-dashboard
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000/api
    depends_on:
      - backend
    ports:
      - "5173:8080"

volumes:
  mongo-data:
  minio-data:
